# Installed as /etc/nginx/conf.d/default.conf, which is included inside http {}.
#
# Serves the built client on :80 and reverse-proxies /ws to the server container.
# The browser only ever talks to this origin, so the client's URL derivation
# (`${scheme}//${window.location.host}/ws`) resolves against this host and port.

# `Connection` must be "upgrade" only for requests that actually are an upgrade.
# Sending it unconditionally is the usual copy-paste bug: it breaks plain HTTP
# requests that happen to hit /ws.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# What scheme the *browser* used, which is not what nginx sees.
#
# The server marks the session cookie `Secure` based on this header. Using
# `$scheme` here would be wrong on the deployed setup: Cloudflare terminates
# TLS at its edge and speaks plain http to the tunnel, so nginx sees http for
# every request even though the visitor is on https.
#
# So: trust an upstream's `X-Forwarded-Proto` when there is one (Cloudflare
# always sets it), and fall back to the scheme nginx itself served when there
# is not — a direct http request to this container, where a Secure cookie would
# be dropped by the browser and login would appear to succeed but never stick.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Without this block every /api/* request falls through to `location /`, which
  # answers with index.html and a 200 — so a failed login would look like a
  # success to `fetch` and then fail to parse. It has to be its own location.
  location /api/ {
    # No trailing slash and no URI, same as /ws below: /api/login must reach the
    # server as /api/login, not as /login.
    proxy_pass http://server:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Carries the browser's scheme through to the server; see the map above.
    # Without it the server sees plain http and never sets Secure, even on the
    # public https site.
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /ws {
    # No trailing slash and no URI: the request path (/ws) is forwarded unchanged.
    # The server mounts its WebSocketServer on exactly "/ws" and rejects the
    # handshake on any other path, so `proxy_pass http://server:3000/;` — which
    # would strip the prefix and send "/" — would fail with a 400.
    proxy_pass http://server:3000;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Required, not cosmetic. The server has no ping/pong heartbeat, so an idle
    # WebSocket sends nothing for minutes. nginx's default proxy_read_timeout is
    # 60s, after which it would sever the connection: the client would silently
    # reconnect (and, while unsynced, lose edits). This outlives any realistic
    # idle period.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
